name: CI

# 每次 push 到 main 或提 PR：在 Windows runner 上构建 + 跑测试（WPF/WinForms 只能在 Windows 上构建）。
# push 一个 v* 标签（如 v1.2.0）：同一次运行里先跑完测试，再发布自包含 / 框架依赖两个单文件 exe，
# 用标签号覆盖版本，各打一个带版本号的 zip，创建 GitHub Release 并附上两个 zip 与框架依赖版的裸 exe。
# 两种构建、三个资产：裸 exe 不是第三种构建，只是小包的另一种打包。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 全局只读，要写的 job 自己提权。
# **PR 触发时 release / publish 根本不跑**，所以 PR 里的代码永远拿不到写令牌。
permissions:
  contents: read

# 分支上新推送取消旧运行；发版运行永不被中途取消——取消到一半的发布会留下一个半成品 release。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15          # 卡住就快点红，别一路挂到 6 小时上限
    steps:
      - uses: actions/checkout@v7
        with:
          # 后面没有 git push，令牌别留在 .git/config 里给后续步骤读。
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # SDK 版本唯一来源是仓库根的 global.json。**别再并排写 dotnet-version**：
          # 两处都写就是两个版本源，升级时必有一处被忘掉。
          #
          # 那边下限锁 10.0.402、rollForward 是 latestFeature——补丁与新的 feature band
          # 自己往上走，这个下限只在要换 LTS 时才动。
          global-json-file: global.json

      # 测试工程 ProjectReference 主程序，还原/构建它即连带把 app 一起编出来。
      - name: Restore
        run: dotnet restore app.Tests/Clockwork.Tests.csproj

      - name: Build
        run: dotnet build app.Tests/Clockwork.Tests.csproj --no-restore -c Release

      # minimum-expected-tests 是 Microsoft.Testing.Platform 自带的守卫，防「静默 0 测试」：
      # 适配器没加载好时，一个用例不跑却退出 0，绿灯骗人。它取代了原先那段手写解析 .trx 的脚本；
      # 让 xunit.v3 跑在 MTP 上的那几处在测试工程的 csproj 与仓库根的 global.json 里。
      # 实测双向：传 1 通过，传 99999 退出 9（MTP 的「没达到最少用例数」退出码）。
      #
      # **`--project` 而不是位置参数**：MTP 模式（global.json 里 "test": { "runner": ... }）是
      # .NET 10 SDK 自带的新 dotnet test 体验，官方文档给的就是这种写法。
      # 位置参数现在也还认，但那是兼容路径，不是推荐路径。
      - name: Test
        shell: pwsh
        run: |
          dotnet test --project app.Tests/Clockwork.Tests.csproj --no-build -c Release -- --minimum-expected-tests 1
          if ($LASTEXITCODE -ne 0) {
            # 失败用例的名字与断言细节**直接打在上面的 stdout 里**（MTP 2.x 的行为：
            # 用例名、Expected/Actual、栈全在，不需要另找文件）。
            # 所以这里只需要把非零退出码变成红灯。
            #
            # 早先这段是从 TestResults/*.log 里 dump 的（v3.1.2 首发就是卡在那：日志里连一个
            # 用例名都没有）。MTP 2 起那个文件**不再更新**——继续 dump 只会掏出一份上一次
            # 跑剩的旧日志，比不 dump 更误导人。所以这段 dump 被删掉了，不是被挪走了。
            exit 1
          }

      # XAML 是懒加载的：某扇窗写错，不打开它就不报错，能一路带到发版。--smoke（app/DevChecks.cs）
      # 构造并布局每一个窗口、断言真的量出了尺寸，然后退出。成败以 marker 文件为准，退出码只在
      # 明确非零时才判失败——Start-Process 读 GUI 进程 ExitCode 有已知读空坑（拿到 $null）。
      - name: Smoke (open every window)
        shell: pwsh
        run: |
          $marker = Join-Path ([System.IO.Path]::GetTempPath()) 'clockwork-smoke.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          $p = Start-Process app/bin/Release/net10.0-windows/Clockwork.exe -ArgumentList '--smoke' -PassThru -Wait
          $ok = (Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq 'OK')
          if (-not $ok) { if (Test-Path $marker) { Get-Content $marker } else { 'no marker written' }; exit 1 }
          if ($p.ExitCode -and $p.ExitCode -ne 0) { exit 1 }

      # 问句弹框是模态的，从外面驱动不了它，所以这条链（打字 → 点确定 → 答案进变量 →
      # 后面的步骤用得上）进不了 app.Tests。--selftest（app/DevSelfTest.cs）在真进程里
      # 按脚本点一遍，7 条检查。同 --smoke：成败以 marker 为准，退出码只在明确非零时才判失败。
      # 它第一次跑就抓到一个线上的死递归（SystemCommands.ClipboardText 调它自己），
      # 那种错会让进程当场消失、日志里一个字都不留——正是单元测试罩不到的那一类。
      - name: Self-test (drive the ask dialog end to end)
        shell: pwsh
        run: |
          $marker = Join-Path ([System.IO.Path]::GetTempPath()) 'clockwork-selftest.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          $p = Start-Process app/bin/Release/net10.0-windows/Clockwork.exe -ArgumentList '--selftest' -PassThru -Wait
          if (-not (Test-Path $marker)) { 'no marker written'; exit 1 }
          $out = (Get-Content $marker -Raw).Trim()
          $out
          if (-not $out.StartsWith('OK')) { exit 1 }
          if ($p.ExitCode -and $p.ExitCode -ne 0) { exit 1 }

  # 一个文件三个 job：needs 让红的树发不出 Release，且不额外花一次测试——同一次运行已经跑过了。
  # 拆成 ci.yml + release.yml 就丢了这点，needs 不能跨 workflow 文件。
  #
  # **release 只把资产传进草稿，publish 才对外公开。** 中间那一步在 Linux 上核对
  # SHA256SUMS.txt：这一核对只有用 GNU coreutils 的 sha256sum 跑才等于用户在 Linux / macOS /
  # WSL 上拿到的那件事。Windows 上的写法看不出 CRLF——本程序自己读校验值时是 Trim() 过的，
  # 所以应用内一切正常，只有真拿 sha256sum -c 去验的人会撞上「文件名里多了个 \r」。
  # v3.2.1 发出去的那份就是这么坏的：已发布资产实测 3 行全是 CRLF，
  # GNU coreutils 8.32 上逐行报 "No such file or directory"（sha256sum 把 \r 当成文件名的一部分）。
  # 现在这道闸就在发布之前，坏文件停在草稿里，用户看不到。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20          # 卡住就快点红，别一路挂到 6 小时上限
    permissions:
      contents: write            # 创建 Release 需要写权限；只给这个 job，PR 触发时它根本不跑
      id-token: write            # attest 那步用：换取 OIDC 令牌去签署构建来源证明
      attestations: write        # 同上：把证明写回 GitHub 侧
      artifact-metadata: write   # 同上：写制品存储记录（官方 README 列为必需，别按旧模板漏掉）
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # 只收 vX.Y.Z。**预发布 tag 进不了 releases/latest**（那个端点只认正式版），
      # 走到 publish 那步的断言只会红，而那时版本已经发出去一半了；在这里就拦下。
      - name: Check tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vX.Y.Z"
            exit 1
          fi

      # **不覆盖已发布的资产**：仓库的规矩是坏掉的发布用新版本往前修，不回头改已发布的那一份。
      #
      # 而这条工作流对同一个 tag 是可以重跑的（concurrency 只取消分支上的运行，tag 运行永不被取消），
      # 于是重跑 release 这一档会拿新构建的资产盖掉用户已经下载过的那一份：
      # SHA256SUMS.txt 随之改变，用户手上的文件对不上校验值，看着像包被改过；
      # 而 draft: true 还会把已发布的那条 release 推回草稿态，用户与 releases/latest 都看不见它。
      #
      # 所以这里先问一句：这条 tag 已经有**发布出去**的那份了吗？有就停。
      # 还没发布的那份（草稿）不拦——「上传中途断了重跑就好」是支持的用法。
      - name: Check the tag was never published before
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 「查不到」与「查不动」必须分开：令牌失效、gh 缺失、5xx……一律**停下**，
          # 不能当成「没发布过」——那正是这道闸要防的那件事（把用户已下载的资产换掉）。
          if published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.id' 2>&1)"; then
            if [ -n "$published" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 已经发布过（release id=${published}）——不覆盖已发布的资产。用新版本往前修。"
              exit 1
            fi
            echo "tag ${GITHUB_REF_NAME} 没有已发布的 release，可以发草稿"
          elif printf '%s' "$published" | grep -qi '404'; then
            # 真的没有这一条（草稿也走这条路：releases/tags 那个端点不返回草稿）。
            echo "tag ${GITHUB_REF_NAME} 没有已发布的 release，可以发草稿"
          else
            echo "::error::无法确认 ${GITHUB_REF_NAME} 是否已发布（不是「没有」）：${published}"
            exit 1
          fi

      # **发版不等人。** 这道闸门拦的不是「谁来批」，是「从哪儿发」。
      #
      # 这个仓库**没有分支保护**（/branches/main/protection 是 404），
      # 所以任何有 push 权限的人都能从任意分支推一个 v* 标签。
      # 「等人审批」那道闸门被明确否掉了（发版不该等审批），
      # 于是这里换一道**不需要人**的：被发版的那个提交必须在 main 的历史里。
      # 机器判、不等人；拦住的是「从别处发版」。
      - name: Check the released commit is on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          # 注解标签（annotated tag）的 object.type 是 "tag"，要再取一层才是提交。
          if [ "$type" = "tag" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
          fi
          # compare 的 status 相对 head：base=被发版的提交，head=main。
          # 提交在 main 的历史里 → main 领先它 → "ahead"；分叉或根本不在 → 不通过。
          #
          # 注意它判的是**祖先关系**，不是「main 现在的内容」：一个后来在 main 上被回退掉的
          # 提交仍然是 main 的祖先，照样放行。要连内容一起判就得比对树，那是另一件事。
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...main" --jq '.status')"
          case "$status" in
            ahead|identical) echo "release commit ${sha} is on main" ;;
            *) echo "::error::the released commit ${sha} is not on main (compare status=${status}) — releases are cut from main"; exit 1 ;;
          esac

      # 标签 v1.2.0 → 版本 1.2.0（去掉前缀 v），注入 exe 让文件版本与标签一致。
      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 两种发布形态都在 app/Properties/PublishProfiles/*.pubxml 里，不挂在 csproj 上——挂上去
      # 日常 build/run 也会走 RID 专属 + 单文件 + 压缩的路径，且自包含工程不能被 app.Tests 引用。
      # 框架依赖版需机器上已装 .NET 10 桌面运行时（缺运行时时 apphost 会自己弹下载提示）。
      - name: Publish single-file exe (self-contained)
        run: dotnet publish app/Clockwork.csproj -c Release -p:PublishProfile=win-x64 -p:Version=${{ steps.ver.outputs.version }}

      - name: Publish single-file exe (framework-dependent)
        run: dotnet publish app/Clockwork.csproj -c Release -p:PublishProfile=win-x64-needs-dotnet10 -p:Version=${{ steps.ver.outputs.version }}

      # 两个 zip——版本形态写在 zip 名里，所以解压出来的永远是干净的 Clockwork.exe，
      # 不会让绿色安装永远顶着一个带版本号的文件名。
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path app/bin/Release/publish/Clockwork.exe -DestinationPath "Clockwork-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path app/bin/Release/publish-needs-dotnet10/Clockwork.exe -DestinationPath "Clockwork-${{ github.ref_name }}-win-x64-needs-dotnet10.zip"

      # 每一个发出去的可下载物都要有一行（两个 zip + 裸 exe），不能只签其中一个形态——两种包
      # 是给两拨人的，漏了哪个，那拨人手里就是个没法验的文件。校验值随构建生成、跟资产同版，
      # 绝不写进 README（文档里的数字会腐烂）。
      - name: SHA256 sums
        shell: pwsh
        run: |
          # 编码写死 ascii：内容本来全是 ASCII，写死就不吃两代 PowerShell 的默认编码差异
          # （Windows PowerShell 5.1 默认写 BOM）。带 BOM 的 sums 文件，第一行摘要会被当成
          # 65 个字符而跳过——那一条恰好是用户按 sha256sum -c 逐条验时先撞上的那条。
          # 同一套判据见 023-QuickText / 033-windowshuttle 的 ci.yml。
          $lines = Get-FileHash *.zip, app/bin/Release/publish-needs-dotnet10/Clockwork.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          # ⚠️ **行尾必须是 LF，不能用 Set-Content。** 它在 Windows 上写 CRLF，而 sha256sum
          # 把那个 `\r` 当成文件名的一部分：Linux / macOS / WSL / Git Bash 里
          # `sha256sum -c SHA256SUMS.txt` 逐条报
          #   sha256sum: 'Clockwork-…-win-x64.zip'$'\r': No such file or directory → FAILED
          # **摘要是对的**（把 `\r` 去掉两条都 OK），坏的是这个文件存在的目的——它被下载去
          # 就是为了让人一条命令验完，而那条命令在非 Windows 上必然报错，看起来像包被改过。
          # v3.2.1 发出去的那份就是 CRLF（已发布资产实测：3 行全是 CRLF）。
          # WriteAllText 不写 BOM（内容是纯 ASCII，字节与 ascii 编码一致），`n` 显式写 LF。
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path 'SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"))
          Get-Content SHA256SUMS.txt

      # 来源证明，比 SHA256SUMS 强一档：sums 和资产同在 release 页，能替换资产的攻击者同样能替换 sums；
      # 证明存在 GitHub 侧，用户用 `gh attestation verify <文件> -R <owner>/<repo>` 验的是
      # 「这个文件确实由本仓库这条 workflow 构建」，而不只是「文件没被改过」。官方 action，无第三方依赖。
      #
      # 用 actions/attest 而不是 actions/attest-build-provenance：后者从 v4 起只是前者的一层包装，
      # 它自己的 README 写明新接入应直接用 actions/attest。
      #
      # ⚠️ **资产清单只有这一处**：`subject-checksums` 读的是上面那份 SHA256SUMS.txt，
      # 而它正是那三个文件。再在这里手抄一遍路径，抄漏一个就有一个资产**静默地没有证明**
      # ——同一条判据见 023-QuickText 的 ci.yml。
      - uses: actions/attest@v4
        with:
          subject-checksums: SHA256SUMS.txt

      # 选包这件事发生在下载页，不是 README，所以说明得跟着 Release 走；GitHub 会把自动 changelog
      # 接在这段 body 后面。体积按 Windows 的算法（MiB）。
      # 用 softprops 而不是自带 gh：和 QuickText 同一套，且它对已存在的 release 是覆盖更新——
      # 上传中途失败重跑一次就好，gh release create 会直接撞「release already exists」。
      # 第三个资产是框架依赖版的裸 exe，直接从 publish 目录上传，因而保持干净的原名：点开即用，
      # 也能直接盖掉已有的 Clockwork.exe 完成更新。只有小包这么发——自带运行时的那个裸 exe 正是浏览器和
      # SmartScreen 最敌视的东西，而不带版本号的名字只能给其中一个。
      #
      # **draft: true —— 资产先停在草稿里**，由 publish job 核对过才对外公开。
      # 重跑会找到同一份草稿、覆盖同名资产（上传中途断了重跑就好）。
      - name: Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          # 逐个写死而不用通配：名字和上面 Package 步骤生成的一一对应，既不会看起来像漏了谁，
          # 也不会因为通配重叠把同一个文件传两遍。列出的文件必须真的在——缺一个就在这里红，
          # 而不是发出去之后由用户发现。
          fail_on_unmatched_files: true
          files: |
            Clockwork-${{ github.ref_name }}-win-x64.zip
            Clockwork-${{ github.ref_name }}-win-x64-needs-dotnet10.zip
            app/bin/Release/publish-needs-dotnet10/Clockwork.exe
            SHA256SUMS.txt
          body: |
            **Which package? / 下载哪个？**

            - `Clockwork-${{ github.ref_name }}-win-x64.zip` — .NET runtime included; unzip and run on any Windows 10/11. Take this if you're unsure. / 内含 .NET 运行时，解压即用；拿不准、或电脑装不了东西就选它。
            - `Clockwork-${{ github.ref_name }}-win-x64-needs-dotnet10.zip` — same app without the bundled runtime; needs the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) installed. / 同一个程序，只是不带运行时；需要电脑上已装 [.NET 10 桌面运行时](https://dotnet.microsoft.com/download/dotnet/10.0)。
            - `Clockwork.exe` — the same build as the zip above, unzipped: click, run, or drop it over your existing Clockwork.exe to update. Windows will offer the runtime download if it is missing. / 就是上面那个不含运行时的版本，只是没打包：点开即用，也可直接覆盖现有的 Clockwork.exe 完成更新。缺运行时时 Windows 会自己提示下载。

            **Unsigned build / 未签名构建：** Clockwork is not code-signed. On first run Windows SmartScreen may show “Windows protected your PC” — choose **More info → Run anyway**. Some antivirus tools may also warn because Clockwork manages startup entries. / 这个程序没有做代码签名。首次运行 SmartScreen 可能弹出「已保护你的电脑」——点「更多信息 → 仍要运行」。部分杀毒软件也可能报警，因为本工具需要管理开机启动项。

            **Verify / 校验：** `sha256sum -c SHA256SUMS.txt`（在下载下来的那个目录里）或 `gh attestation verify <文件> -R rockbenben/Clockwork`。
          generate_release_notes: true

  # 把草稿核对过再公开。这一步跑在 Linux 上——sha256sum -c 只有在 GNU coreutils 上跑，
  # 才是用户拿到 SHA256SUMS.txt 之后真正会做的那件事。
  # 核对不过就停在草稿里：用户看不到一个校验文件坏掉的 release。
  publish:
    needs: release
    runs-on: ubuntu-latest
    # 环境名只是给这次发布留一条 deployment 记录（仓库的 Deployments 页能查）。
    # **它刻意没有保护规则**：发版不该等审批（仓库主人的决定）。
    # 「从哪儿发」那道闸门在 release job 里——被发版的提交必须在 main 的历史上——
    # 那是机器判的，不等人。
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write            # 把草稿转正并指到 latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Verify the draft's assets
        run: |
          set -euo pipefail
          # 草稿也能下载：gh 走 GraphQL 找「待发布 tag 名」下的草稿，REST 的 releases/tags
          # 那个端点只返回已发布的（见下面 publish 那步的注释）。
          mkdir dl && cd dl
          gh release download "$TAG" -R "$GH_REPO" --dir . --clobber
          ls -l
          # **这一句就是用户在 Linux / macOS / WSL 上会敲的那一句。**
          # 校验文件少一行、摘要对不上、行尾是 CRLF，三种都在这里现形。
          sha256sum -c SHA256SUMS.txt

      - name: Publish the release and point latest at it
        run: |
          set -euo pipefail
          # **这一档只管指针，不管资产**（资产是 release 那一档传的，那一档才有「不覆盖
          # 已发布的资产」那道闸）。所以它必须**可重跑**：
          #   · 指针已经指着这条 tag → 什么都不用做，退出 0；
          #   · 指针没指着（上一次 PATCH 之后断言失败）→ 补一次 PATCH，把指针挪过来——
          #     那正是这一档存在的理由（GitHub 在「草稿转正」时不会重算 releases/latest，
          #     2026-10-20 在 rclone-deck 上撞到过一次：release 已经发布，
          #     releases/latest 却仍返回旧版本，端点 releases/latest/download/latest.json
          #     于是 404——已装的应用从此收不到更新）。
          # 早先这里有一道「已经发布过就停」的闸：它把上面那条**修复路径**也堵死了，
          # 于是指针永远挪不过来，404 永远修不好。
          latest="$(gh api "repos/${GH_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")"
          if [ "$latest" = "$TAG" ]; then
            echo "release ${TAG} 已发布，且 releases/latest 已经指着它——这一档无事可做。"
            exit 0
          fi
          # ⚠️ **显式给 make_latest 不是多此一举**：GitHub 在「草稿转成已发布」时**不会**
          # 重算 `releases/latest` 指向谁。2026-10-20 在 rclone-deck 上撞到过一次：release 已经是
          # `draft=false`、`prerelease=false`、`published_at` 也填上了，`releases/latest` 却仍
          # 返回旧版本，端点 `releases/latest/download/latest.json` 于是 404（旧 release 里没有
          # 那个文件）——已装的应用从此收不到更新。
          #
          # ⚠️ **不能用 `releases/tags/<tag>` 找这条 release**：那个端点**不返回草稿**。
          # 草稿只能从 release 列表里捞——列表按创建时间倒序，新建的草稿总在第一页。
          id="$(gh api "repos/${GH_REPO}/releases?per_page=100" \
                 --jq "first(.[] | select(.tag_name == \"${TAG}\") | .id)")"
          if [ -z "$id" ]; then
            echo "::error::没找到 tag ${TAG} 对应的 release"
            exit 1
          fi
          gh api --method PATCH "repos/${GH_REPO}/releases/${id}" \
            -F draft=false -f make_latest=true > /dev/null
          latest="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::releases/latest 指着 ${latest}，不是 ${TAG}"
            exit 1
          fi
          echo "release ${TAG} 已发布，releases/latest 指向它"
