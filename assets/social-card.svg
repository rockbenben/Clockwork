<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 这张卡在 X / Discord / GitHub 链接预览里的真实宽度是 360–500px，不是 1200px。
       实测：按 1200 设计时，24px 的说明文字到 360px 只剩 7.2px —— 四行说明和页脚全是灰糊，
       只有大标题活着。所以这一版按**投递尺寸**排：源文件里小于 40px 的字一律不承担信息，
       能被读到的只有品牌、标题、四个触发词。说明文字全部删掉——读不出的说明只贡献噪点。 -->
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191919"/><stop offset="0.6" stop-color="#101010"/><stop offset="1" stop-color="#0B0B0B"/></linearGradient>
    <radialGradient id="cglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C170" stop-opacity="0.13"/><stop offset="1" stop-color="#E8C170" stop-opacity="0"/></radialGradient>
    <linearGradient id="brass" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#EBBE66"/><stop offset="1" stop-color="#C08C2E"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#cbg)"/>
  <circle cx="1140" cy="380" r="330" fill="url(#cglow)"/>

  <!-- 擒纵轮放大到出血。图形比文字耐缩放得多，所以视觉识别交给它。
       裁掉一部分而不是整轮塞进角落：残缺的机械读作「里面那台机器比画框还大」，
       而一个完整的小轮子只读作一个图标。这是这一版唯一冒的险。
       裁的位置刻意让**齿**而不是轮毂占据可见部分：一只完整的轮毂会把它读成钟面。
       **这里用的就是 logo.svg 那条路径本身**（同一份齿形，轴毂同样是填色而不是镂空），不是另画一个近似的：
       卡片和标识必须是同一个东西，而两份手抄的几何迟早会漂。 -->
  <g transform="translate(1140,380) scale(2.96) translate(-128,-128)" opacity="0.18">
    <path d="M128.00,30.92 L168.71,12.06 L165.15,38.31 L209.98,36.47 L196.64,59.36 L238.77,74.81 L217.69,90.85 L250.69,121.25 L225.08,128.00 L243.94,168.71 L217.69,165.15 L219.53,209.98 L196.64,196.64 L181.19,238.77 L165.15,217.69 L134.75,250.69 L128.00,225.08 L87.29,243.94 L90.85,217.69 L46.02,219.53 L59.36,196.64 L17.23,181.19 L38.31,165.15 L5.31,134.75 L30.92,128.00 L12.06,87.29 L38.31,90.85 L36.47,46.02 L59.36,59.36 L74.81,17.23 L90.85,38.31 L121.25,5.31 Z" fill="#D9A544"/>
  </g>

  <!-- 品牌 -->
  <g transform="translate(70,92)">
    <g transform="translate(0,-4) scale(0.18)">
      <path d="M128.00,30.92 L168.71,12.06 L165.15,38.31 L209.98,36.47 L196.64,59.36 L238.77,74.81 L217.69,90.85 L250.69,121.25 L225.08,128.00 L243.94,168.71 L217.69,165.15 L219.53,209.98 L196.64,196.64 L181.19,238.77 L165.15,217.69 L134.75,250.69 L128.00,225.08 L87.29,243.94 L90.85,217.69 L46.02,219.53 L59.36,196.64 L17.23,181.19 L38.31,165.15 L5.31,134.75 L30.92,128.00 L12.06,87.29 L38.31,90.85 L36.47,46.02 L59.36,59.36 L74.81,17.23 L90.85,38.31 L121.25,5.31 Z" fill="url(#brass)"/>
      <circle cx="128" cy="128" r="30.72" fill="#7A5115"/>
      <circle cx="128" cy="128" r="9.34" fill="#F2DCA6"/>
    </g>
    <text x="60" y="30" font-family="Bahnschrift, DIN, sans-serif" font-weight="600" font-size="40" fill="#EAEAEA" letter-spacing="0.5">Clockwork</text>
  </g>

  <!-- 承诺。两行，字号从 62 提到 72：它是唯一在 360px 下仍然舒服的东西，值得占更多地方。 -->
  <text x="70" y="268" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="72" fill="#EAEAEA" letter-spacing="1">电脑上重复的事，</text>
  <text x="70" y="356" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="72" fill="#EAEAEA" letter-spacing="1">自动<tspan fill="#E8C170">帮你做</tspan></text>

  <!-- 四种开始方式。横排在一条轨上：四个位置属于同一套机构，正如轮上的四颗齿。
       只留词，不留说明——四个词本身就说清了「它会在什么时候自己动」。 -->
  <g>
    <line x1="70" y1="452" x2="606" y2="452" stroke="#B5842F" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="70" y="420" width="116" height="64" rx="12" fill="#191919" stroke="#B5842F" stroke-opacity="0.55" stroke-width="2"/>
    <text x="128" y="466" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="40" fill="#E8C170" text-anchor="middle">开机</text>
    <rect x="210" y="420" width="116" height="64" rx="12" fill="#191919" stroke="#B5842F" stroke-opacity="0.55" stroke-width="2"/>
    <text x="268" y="466" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="40" fill="#E8C170" text-anchor="middle">到点</text>
    <rect x="350" y="420" width="116" height="64" rx="12" fill="#191919" stroke="#B5842F" stroke-opacity="0.55" stroke-width="2"/>
    <text x="408" y="466" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="40" fill="#E8C170" text-anchor="middle">一键</text>
    <rect x="490" y="420" width="116" height="64" rx="12" fill="#191919" stroke="#B5842F" stroke-opacity="0.55" stroke-width="2"/>
    <text x="548" y="466" font-family="Microsoft YaHei, sans-serif" font-weight="700" font-size="40" fill="#E8C170" text-anchor="middle">手势</text>
  </g>

  <!-- 页脚：全尺寸下才读的信息，刻意压低对比，缩小时读作一条安静的横线而不是一团糊字。 -->
  <line x1="70" y1="556" x2="1130" y2="556" stroke="#353535" stroke-opacity="0.7"/>
  <text x="70" y="590" font-family="Consolas, monospace" font-size="18" fill="#7C7C7C" letter-spacing="1">365 开源计划 · #020</text>
  <text x="1130" y="590" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#9E9E9E" text-anchor="end">一个 exe · 不用安装 · 不联网</text>
</svg>
