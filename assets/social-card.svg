<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub 的 Social preview 规格：1280x640（2:1），不超过 1MB，
       只能在 Settings → General → Social preview 手动上传。
       这张卡替代原先那张 1200x630 的中文卡：那个比例是 Twitter 口径，
       语言也跟仓库首屏（英文 README）不一致。

       排版按投递尺寸定：链接预览实际被看到的是 360~500px 宽（约 x0.34），
       所以源文件里小于 40px 的字一律不承担信息。旧版页脚那两串（18px 与 20px）
       在 440px 下只剩 6~7px，是灰糊；这一版把它们并成一行 40px。

       出血那只轮子用的是 assets/logo.svg 里那条路径本身，不是另画一份近似的。
       手抄几何会漂这件事，tools/make_icon.py 里已经踩过一次；改了形状要重新抄这一份，
       下面的断言就是拿来盯这件事的。 -->

<defs><linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191919"/><stop offset="0.6" stop-color="#101010"/><stop offset="1" stop-color="#0B0B0B"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C170" stop-opacity="0.15"/><stop offset="1" stop-color="#E8C170" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="640" fill="url(#cbg)"/>
<g transform="translate(1080,330) scale(2.7) translate(-128,-128) rotate(-12)" opacity="0.13"><path d="M128.00,30.92 L168.71,12.06 L165.15,38.31 L209.98,36.47 L196.64,59.36 L238.77,74.81 L217.69,90.85 L250.69,121.25 L225.08,128.00 L243.94,168.71 L217.69,165.15 L219.53,209.98 L196.64,196.64 L181.19,238.77 L165.15,217.69 L134.75,250.69 L128.00,225.08 L87.29,243.94 L90.85,217.69 L46.02,219.53 L59.36,196.64 L17.23,181.19 L38.31,165.15 L5.31,134.75 L30.92,128.00 L12.06,87.29 L38.31,90.85 L36.47,46.02 L59.36,59.36 L74.81,17.23 L90.85,38.31 L121.25,5.31 Z" fill="#E8C170"/></g>
<circle cx="1080" cy="320" r="400" fill="url(#glow)"/>
<image href="logo-256.png" x="72" y="87" width="46" height="46"/><text x="136" y="118" font-family="Bahnschrift, DIN, Segoe UI, sans-serif" font-weight="600" font-size="46" fill="#EAEAEA" letter-spacing="0.5">Clockwork</text>
<text x="1208" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#7C7C7C" text-anchor="end">free &#183; open source</text>
<text x="72" y="276" font-family="Bahnschrift, DIN, Segoe UI, sans-serif" font-weight="700" font-size="88" fill="#EAEAEA">Put the repetitive parts</text>
<text x="72" y="368" font-family="Bahnschrift, DIN, Segoe UI, sans-serif" font-weight="700" font-size="88" fill="#EAEAEA">of your PC on <tspan fill="#E8C170">autopilot</tspan></text>
<line x1="72" y1="452" x2="1208" y2="452" stroke="#353535" stroke-width="2"/>
<rect x="72" y="499" width="228" height="72" rx="14" fill="#191919" stroke="#B5842F" stroke-opacity="0.6" stroke-width="2"/><text x="186" y="548" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="40" fill="#E8C170" text-anchor="middle">At login</text><rect x="318" y="499" width="206" height="72" rx="14" fill="#191919" stroke="#B5842F" stroke-opacity="0.6" stroke-width="2"/><text x="421" y="548" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="40" fill="#E8C170" text-anchor="middle">On time</text><rect x="542" y="499" width="206" height="72" rx="14" fill="#191919" stroke="#B5842F" stroke-opacity="0.6" stroke-width="2"/><text x="645" y="548" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="40" fill="#E8C170" text-anchor="middle">One tap</text><rect x="766" y="499" width="206" height="72" rx="14" fill="#191919" stroke="#B5842F" stroke-opacity="0.6" stroke-width="2"/><text x="869" y="548" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="40" fill="#E8C170" text-anchor="middle">Gesture</text>
<text x="72" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#9E9E9E">one exe &#183; no installer &#183; nothing leaves your PC</text>
</svg>